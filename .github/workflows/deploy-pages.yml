name: Publicar Zabal Performance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar la API remota
        env:
          APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
        run: |
          if [ -z "$APPS_SCRIPT_URL" ]; then
            echo "::error::Falta la variable VITE_APPS_SCRIPT_URL del repositorio."
            exit 1
          fi

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar la aplicación remota
        env:
          VITE_DATA_PROVIDER: google-sheets
          VITE_TEAM_NAME: ${{ vars.VITE_TEAM_NAME || 'Atlético Zabal Linense · Cadete A' }}
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL || 'https://cadetea.atleticozabal.com/' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
        run: pnpm build

      - name: Preparar archivos de publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
